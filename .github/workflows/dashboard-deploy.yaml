---

# Name shown in the GitHub Actions workflow interface
name: dashboard-deployment

# Run this workflow whenever code is pushed to the main branch
on:
  push:
    branches:
      - main
    paths:
      - 'projects/dashboard/**'

# Give the workflow only the permissions it needs
permissions:
  contents: read

jobs:
  # Job responsible for building the Docker image and pushing it to Docker Hub
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Download the repository contents onto the GitHub Actions runner
      # This gives Docker access to the Dockerfile and application files
      - name: Checkout repository
        uses: actions/checkout@v4

      # Authenticate with Docker Hub so the workflow can push the image
      # The username is stored as a GitHub Actions variable
      # The Docker Hub PAT is stored as a GitHub Actions secret
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Set up Docker Buildx, which provides the modern Docker build engine
      # Buildx also allows us to use advanced features such as caching
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Generate Docker image metadata and tags
      # This creates both:
      #   - A branch tag, e.g. dashboard:main
      #   - A commit SHA tag, e.g. dashboard:sha-7db5b9a
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/dashboard
          tags: |
            type=ref,event=branch
            type=sha

      # Build the Docker image and push it to Docker Hub
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          # The Docker build context is the dashboard directory
          # Docker will therefore use projects/dashboard/Dockerfile
          context: ./projects/dashboard

          # Push the successfully built image to Docker Hub
          push: true

          # Use the tags generated by the metadata step
          tags: ${{ steps.meta.outputs.tags }}

          # Add the labels generated by the metadata step
          labels: ${{ steps.meta.outputs.labels }}

          # Reuse Docker build cache from previous workflow runs
          # This can make subsequent builds significantly faster
          cache-from: type=gha
          cache-to: type=gha,mode=max